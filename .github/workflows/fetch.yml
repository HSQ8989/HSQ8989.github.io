name: Auto Fetch Lottery

on:
  schedule:
    - cron: '20 13 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and save
        run: |
          python3 << 'PYEOF'
          import json, time, urllib.request, os
          from datetime import datetime

          API_URL = "https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=350133&provinceId=0&pageSize=500&isVerify=1&pageNo=1"

          def fetch_data():
              req = urllib.request.Request(API_URL, headers={
                  'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)',
                  'Referer': 'https://www.sporttery.cn/'
              })
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read())

          def save_json(data):
              rows = []
              for item in data['value']['list'][:50]:
                  qh = item['lotteryDrawNum']
                  nums = item['lotteryDrawResult'].split(' ')
                  dt = item['lotteryDrawTime']
                  d = datetime.strptime(dt[:10], '%Y-%m-%d')
                  wd = ['日','一','二','三','四','五','六'][(d.weekday()+1)%7]
                  ds = dt[5:7] + '/' + dt[8:10] + ' ' + wd
                  rows.append({"q": qh, "d": ds, "n": nums[:4], "s": nums[4]})
              out = {"rows": rows, "ts": int(time.time()*1000)}
              with open('data.json', 'w') as f:
                  json.dump(out, f, ensure_ascii=False)
              return rows[0]['q'] if rows else None

          try:
              data = fetch_data()
              last_q = save_json(data)
              print(f"[first] {last_q}")
          except Exception as e:
              print(f"Error: {e}")
              last_q = None

          start = time.time()
          while time.time() - start < 1500:
              time.sleep(5)
              try:
                  data = fetch_data()
                  cur_q = save_json(data)
                  if cur_q and cur_q != last_q:
                      print(f"new: {cur_q}")
                      last_q = cur_q
              except Exception as e:
                  print(f"poll error: {e}")

          os.system('git config user.email "bot@haocai.com"')
          os.system('git config user.name "haocai-bot"')
          os.system('git add data.json')
          os.system('git diff --staged --quiet || git commit -m "update data"')
          os.system('git push')
          PYEOF
